name: Publish npm RC

on:
  push:
    tags: ['npm-v*-rc.*']
  workflow_call:
  workflow_dispatch:
    inputs:
      wasm_run_id:
        description: 'Trusted RC run whose unchanged WASM build should be reused'
        type: string
        default: ''
      package_run_id:
        description: 'Promote an already-tested package from an identical source tree (publishing-only corrections)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    if: inputs.package_run_id == ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/web.yml
    with:
      wasm_run_id: ${{ inputs.wasm_run_id || '' }}
  publish:
    needs: build
    if: always() && github.repository == 'sssilvar/vv' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.package_run_id != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: inputs.package_run_id != ''
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          registry-url: https://registry.npmjs.org
      - name: Verify tested package source
        if: inputs.package_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
          WASM_RUN_ID: ${{ inputs.wasm_run_id }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const id = process.env.PACKAGE_RUN_ID;
          assert(/^[1-9]\d*$/.test(id) && !process.env.WASM_RUN_ID, 'Choose one valid reuse run');
          const api = `repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${id}`;
          const read = (path) => JSON.parse(execFileSync('gh', ['api', path], { encoding: 'utf8' }));
          const run = read(api);
          assert(['push', 'workflow_dispatch'].includes(run.event));
          assert(/^(npm-)?v\d+\.\d+\.\d+-rc\.\d+$/.test(run.head_branch));
          assert.equal(run.path, '.github/workflows/npm-publish.yml');
          const jobs = read(`${api}/jobs?per_page=100`).jobs;
          for (const name of ['build / package', 'build / browsers (chromium, ubuntu-24.04)', 'build / browsers (firefox, macos-15)', 'build / browsers (webkit, macos-15)']) {
            assert(jobs.some(job => job.name === name && job.conclusion === 'success'), `Missing successful gate: ${name}`);
          }
          execFileSync('git', ['diff', '--exit-code', run.head_sha, 'HEAD', '--', '.', ':!.github/workflows/npm-publish.yml'], { stdio: 'inherit' });
          console.log(`Promoting tested archive from ${run.head_sha}`);
          JS
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: package
          run-id: ${{ inputs.package_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify tag matches packed RC
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archives=(package/*.tgz)
          test "${#archives[@]}" -eq 1
          tar -xOf "${archives[0]}" package/package.json > metadata.json
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('metadata.json', 'utf8'));
          const versions = JSON.parse(readFileSync('package/release-versions.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          const appTag = /^v(\d+\.\d+\.\d+)-rc\.\d+$/.exec(tag);
          if (pkg.name !== '@sssilvar/vv-wasm' || !/^\d+\.\d+\.\d+-rc\.\d+$/.test(pkg.version) || versions.packageName !== pkg.name || versions.packageVersion !== pkg.version || (tag !== `npm-v${pkg.version}` && appTag?.[1] !== versions.appVersion)) {
            throw new Error('Package name, RC version or release tag mismatch');
          }
          JS
      - name: Publish verified archive with provenance
        run: npm publish ./package/*.tgz --access public --tag rc --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
