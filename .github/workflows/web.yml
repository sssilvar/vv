name: Web package

on:
  pull_request:
    paths: ['web/**', 'src/visualization/**', 'src/ScalarVizUtils*', 'CMakeLists.txt', 'scripts/build-wasm.sh', '.github/workflows/web.yml']
  push:
    branches: [main]
    paths: ['web/**', 'src/visualization/**', 'src/ScalarVizUtils*', 'CMakeLists.txt', 'scripts/build-wasm.sh', '.github/workflows/web.yml']
  workflow_call:
    inputs:
      wasm_run_id:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      wasm_run_id:
        description: 'Reuse WASM from a trusted RC run with identical C++ build inputs (blank rebuilds)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  package:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm format:check && pnpm lint
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        if: inputs.wasm_run_id == ''
        with:
          version: '6.0.10'
          no-cache: true
      - run: pnpm build
        if: inputs.wasm_run_id == ''
      - name: Verify reusable WASM source and toolchain
        if: inputs.wasm_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WASM_RUN_ID: ${{ inputs.wasm_run_id }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const id = process.env.WASM_RUN_ID;
          assert(/^[1-9]\d*$/.test(id), 'Invalid source run ID');
          const run = JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${id}`], { encoding: 'utf8' }));
          assert.equal(run.event, 'push');
          assert(/^(npm-)?v\d+\.\d+\.\d+-rc\.\d+$/.test(run.head_branch), 'Source must be an RC tag run');
          execFileSync('git', ['fetch', '--no-tags', 'origin', run.head_sha], { stdio: 'inherit' });
          execFileSync('git', ['diff', '--exit-code', run.head_sha, 'HEAD', '--', '../src', '../cmake', '../CMakeLists.txt', '../scripts/build-wasm.sh'], { stdio: 'inherit' });
          const original = execFileSync('git', ['show', `${run.head_sha}:.github/workflows/web.yml`], { encoding: 'utf8' });
          const current = readFileSync('../.github/workflows/web.yml', 'utf8');
          const toolchain = /uses: (mymindstorm\/setup-emsdk@\w+)[\s\S]*?version: '([^']+)'/;
          assert.deepEqual(original.match(toolchain)?.slice(1), current.match(toolchain)?.slice(1), 'Emscripten toolchain differs');
          assert(current.match(toolchain), 'Missing Emscripten toolchain');
          console.log(`Reusing WASM from verified source ${run.head_sha}`);
          JS
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.wasm_run_id != ''
        with:
          name: wasm-runtime
          path: web/src/wasm
          run-id: ${{ inputs.wasm_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm exec vite build --config vite.config.tsx && pnpm exec tsc
        if: inputs.wasm_run_id != ''
      - run: pnpm build:storybook
      - name: Pack release artifact
        run: npm pack --ignore-scripts && node scripts/check-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: |
            web/*.tgz
            web/release-versions.json
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storybook
          path: web/storybook-static
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-runtime
          path: |
            web/src/wasm/vv.js
            web/src/wasm/vv.wasm
          if-no-files-found: error
          retention-days: 3

  browsers:
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-24.04
          - browser: firefox
            os: macos-15
          - browser: webkit
            os: macos-15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wasm-runtime
          path: web/src/wasm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.browser == 'chromium'
        with:
          name: storybook
          path: web/storybook-static
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      # Use native macOS graphics for Firefox/WebKit; Chromium uses SwiftShader.
      - run: pnpm test:e2e --project=${{ matrix.browser }}
        timeout-minutes: 5
      - run: pnpm test:storybook
        if: matrix.browser == 'chromium'
        timeout-minutes: 5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failures-${{ matrix.browser }}
          path: web/test-results
          retention-days: 3
