name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

defaults:
  run:
    shell: bash

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check tracked C++ sources
        run: |
          clang-format --version
          git ls-files -z -- 'src/*.cpp' 'src/include/*.h' 'tests/*.cpp' 'tests/*.h' |
            xargs -0 clang-format --dry-run --Werror

  quality:
    needs: format
    runs-on: ubuntu-24.04
    name: Linux tests and analysis
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache clang-format clang-tidy cppcheck clazy \
            qtbase5-dev libcxxopts-dev nlohmann-json3-dev \
            libvtk9-dev libvtk9-qt-dev \
            libgl-dev libglx-dev libxt-dev
      - uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: ccache-${{ github.workflow }}-ubuntu-24.04
          max-size: 500M
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DVV_ENABLE_WARNINGS=ON -DVV_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Regression tests
        run: ctest --test-dir build --output-on-failure
      - name: Static analysis gates
        run: ./build.sh --no-build --cppcheck-check --clang-tidy-check
      - name: Clazy trial
        continue-on-error: true
        run: |
          mkdir -p analysis-results
          ./build.sh --no-build --clazy 2>&1 | tee analysis-results/clazy.log
      - name: Unused-function audit
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          mkdir -p analysis-results
          ./build.sh --no-build --unused-functions 2>&1 | tee analysis-results/unused-functions.log
      - name: Full clang-tidy review
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: ./build.sh --no-build --clang-tidy
      - name: CPU interaction benchmarks
        env:
          QT_QPA_PLATFORM: offscreen
          VV_RUN_BENCHMARKS: "1"
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          build/tests/vv_viewer_tests benchmarkFacetSetup -iterations 5 -median 5 -o benchmark-results/cpu-setup.xml,xml -o -,txt
          build/tests/vv_viewer_tests benchmarkColumnInteraction -iterations 1000 -median 5 -o benchmark-results/cpu-interaction.xml,xml -o -,txt
      - name: Software OpenGL frame benchmark
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a build/tests/vv_render_benchmark --require-rendering --output benchmark-results/render.json
      - name: Benchmark summary
        if: always()
        run: python3 scripts/benchmark-summary.py benchmark-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmarks-linux-${{ github.sha }}
          path: benchmark-results/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: analysis-linux-${{ github.sha }}
          path: analysis-results/
          if-no-files-found: ignore
          retention-days: 7

  sanitizers:
    needs: format
    name: Linux ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache \
            qtbase5-dev libcxxopts-dev nlohmann-json3-dev \
            libvtk9-dev libvtk9-qt-dev libgl-dev libglx-dev libxt-dev \
            xvfb xauth openbox libgl1-mesa-dri
      - uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: ccache-${{ github.workflow }}-sanitizers-ubuntu-24.04
          max-size: 500M
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DVV_ENABLE_SANITIZERS=ON \
            -DVV_TEST_QPA_PLATFORM=xcb \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j 4
      - name: Regression tests under sanitizers
        env:
          ASAN_OPTIONS: fast_unwind_on_malloc=0
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan-fontconfig.supp:print_suppressions=1
        run: xvfb-run -a ./scripts/test-sanitizers.sh build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sanitizer-test-logs
          path: build/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  platforms:
    needs: format
    name: Tests and benchmarks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            shell: bash
            platform: cocoa
            render_args: --smoke
          - os: windows-latest
            shell: "msys2 {0}"
            platform: windows
            render_args: ""
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          for pkg in cmake ninja ccache vtk qtbase cxxopts nlohmann-json; do
            brew list --versions "$pkg" >/dev/null || brew install "$pkg"
          done
      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-vtk
            mingw-w64-x86_64-fast_float
            mingw-w64-x86_64-hdf5
            mingw-w64-x86_64-cxxopts
            mingw-w64-x86_64-nlohmann-json
      - uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        if: runner.os == 'macOS'
        with:
          key: ccache-${{ github.workflow }}-${{ matrix.os }}
          max-size: 500M
      - name: Configure and build
        run: |
          set -euo pipefail
          prefix=/mingw64
          if [ "$RUNNER_OS" = macOS ]; then
            prefix="$(brew --prefix qtbase);$(brew --prefix vtk)"
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DVV_ENABLE_WARNINGS=ON -DVV_WARNINGS_AS_ERRORS=ON \
            -DVV_QT_WINDOWS_DEPLOY=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build -j 4
      - name: Regression tests
        run: ctest --test-dir build --output-on-failure
      - name: CPU interaction benchmarks
        env:
          QT_QPA_PLATFORM: offscreen
          VV_RUN_BENCHMARKS: "1"
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          build/tests/vv_viewer_tests benchmarkFacetSetup -iterations 5 -median 5 -o benchmark-results/cpu-setup.xml,xml -o -,txt
          build/tests/vv_viewer_tests benchmarkColumnInteraction -iterations 1000 -median 5 -o benchmark-results/cpu-interaction.xml,xml -o -,txt
      - name: Native OpenGL frame benchmark
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: ${{ matrix.platform }}
        run: build/tests/vv_render_benchmark ${{ matrix.render_args }} --output benchmark-results/render.json
      - name: Benchmark summary
        if: always()
        shell: python
        run: |
          import runpy, sys
          sys.argv = ['scripts/benchmark-summary.py', 'benchmark-results']
          runpy.run_path(sys.argv[0], run_name='__main__')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmarks-${{ matrix.os }}-${{ github.sha }}
          path: benchmark-results/
          retention-days: 7
